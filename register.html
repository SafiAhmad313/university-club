<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Club Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>University Club Registration</h1>
    <form id="registrationForm">
        <fieldset>
            <legend>Personal Information</legend>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required minlength="2" maxlength="100" placeholder="Enter your full name">
            
            <label for="universityEmail">University Email:</label>
            <input type="email" id="universityEmail" name="universityEmail" required placeholder="Enter your university email">
            
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="Enter phone number (XXX-XXX-XXXX)">
        </fieldset>

        <fieldset>
            <legend>Event Information</legend>
            <label for="eventChoice">Event Choice:</label>
            <select id="eventChoice" name="eventChoice" required>
                <option value="">Select an event</option>
                <option value="event1">Annual Cricket Tournament</option>
                <option value="event2">Friendly Match</option>
                <option value="event3">Charity Cricket Match</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>How did you hear about us?</legend>
            <input type="checkbox" id="referral" name="referral" value="referral">
            <label for="referral">Referral</label>

            <input type="checkbox" id="socialMedia" name="socialMedia" value="socialMedia">
            <label for="socialMedia">Social Media</label>

            <input type="radio" id="advertisement" name="howHear" value="advertisement">
            <label for="advertisement">Advertisement</label>

            <input type="radio" id="other" name="howHear" value="other">
            <label for="other">Other</label>
        </fieldset>

        <button type="submit">Register</button>
    </form>

    <section id="savedRegistrations">
        <h2>Saved Registrations</h2>
        <table id="registrationsTable">
            <thead>
                <tr>                    
                    <th>Full Name</th>
                    <th>University Email</th>
                    <th>Phone</th>
                    <th>Event Choice</th>
                    <th>How Did You Hear About Us?</th>
                </tr>
            </thead>
            <tbody id="registrationsBody"></tbody>
        </table>
        <button id="clearAllButton">Clear All Registrations</button>
    </section>

   <script src="script.js"></script>
</body>
</html>
